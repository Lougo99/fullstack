<section>
  <div class="titre-page">
    <h2>Films</h2>

    <a
      class="bouton"
      routerLink="/films/nouveau">
      Ajouter un film
    </a>
  </div>

  @if (erreur(); as message) {
    <p class="erreur">
      {{ message }}
    </p>
  }

    @for (film of (films$()); track film.id) {
      <app-film-card
        [film]="film"
        (supprimer)="onSupprimer($event)" />
    } @empty {
      <p>Aucun film enregistré.</p>
    }
</section>
