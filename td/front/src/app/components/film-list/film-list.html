<section>
  <div class="titre-page">
    <h2>Films</h2>

    <a routerLink="/films/nouveau">
      Ajouter un film
    </a>
  </div>

  @if (erreur(); as message) {
    <p class="erreur">
      {{ message }}
    </p>
  }

  @if (films$ | async; as films) {
    <ul>
      @for (film of films; track film.id) {
        <li [class.ancien]="estAncien(film)">
          <a [routerLink]="['/films', film.id]">
            {{ film.titre }}
          </a>

          <span>
            — {{ film.realisateur }}
            — {{ film.dateSortie | date: 'dd/MM/yyyy' }}
          </span>
        </li>
      } @empty {
        <li>Aucun film enregistré.</li>
      }
    </ul>
  }
</section>
